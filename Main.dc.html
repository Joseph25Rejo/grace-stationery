<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grace Stationery</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500;1,9..144,700&amp;family=DM+Sans:wght@400;500;700&amp;family=Great+Vibes&amp;family=Noto+Serif+Kannada:wght@800&amp;display=swap">
<style>
body{margin:0}
html{scroll-behavior:smooth}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #34506B;outline-offset:3px;border-radius:6px}
.disp{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-0.01em}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.mark{background:linear-gradient(transparent 64%,#FFD84D 64%,#FFD84D 90%,transparent 90%);padding:0 .08em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s ease}
.btn:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:0 10px 22px rgba(52,80,107,.2)}
.nav a.l{display:flex;align-items:center;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;border-radius:999px}
.nav a.l:hover{background:#F1E9DB}
.cat{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:28px;border:1px solid #E4DCCD;border-radius:20px;background:var(--cbg,#FFFFFF);box-shadow:0 1px 1px rgba(52,80,107,.08),0 10px 28px rgba(52,80,107,.08);transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s ease}
.cat::before{content:"";position:absolute;top:-10px;right:26px;width:64px;height:22px;background:rgba(255,216,77,.85);transform:rotate(5deg);opacity:0;transition:opacity .2s ease, transform .25s ease}
.cat:hover{transform:translateY(-6px) rotate(-1.2deg);box-shadow:0 2px 2px rgba(52,80,107,.08),0 22px 40px rgba(52,80,107,.16)}
.cat:hover::before{opacity:1;transform:rotate(-4deg)}
.cat h3{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:26px;line-height:1.1}
.cat p{margin:8px 0 0;font-size:15px;line-height:1.5;color:#4F5F6E}
.s6{grid-column:span 6}.s3{grid-column:span 3}.s2{grid-column:span 2}
.row:hover{background:rgba(255,216,77,.28)}
.qlink{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 14px;font-weight:500;border-bottom:1px dashed #B9A98F;border-radius:6px}
.qlink:hover{background:rgba(255,216,77,.3)}
.sticky-bar{display:none}
.menu{display:none;position:relative}
.menu summary{list-style:none;display:flex;align-items:center;min-height:44px;padding:0 18px;border:1.5px solid #34506B;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu .panel{position:absolute;right:0;top:52px;z-index:30;width:240px;background:#FFFFFF;border:1px solid #E4DCCD;border-radius:16px;padding:8px;box-shadow:0 18px 40px rgba(52,80,107,.2)}
.menu .panel a{display:flex;align-items:center;min-height:48px;padding:0 14px;font-weight:500;border-radius:10px}
.menu .panel a:hover{background:#F1E9DB}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .5s cubic-bezier(.6,0,.2,1) forwards}
.stamp{transform-origin:400px 372px;animation:thunk .55s .9s cubic-bezier(.3,1.5,.5,1) both}
.hint{opacity:0;transition:opacity .25s ease}
.wink:hover .hint,.wink:focus-within .hint{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes thunk{0%{transform:scale(1.7) rotate(-22deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@property --cnt{syntax:'<integer>';inherits:true;initial-value:1}
@keyframes prog{to{--p:1}}
@supports (animation-timeline: view()){
.reveal{animation:rise linear backwards;animation-timeline:view();animation-range:entry 0% entry 40%}
.cat:nth-child(2n){animation-range:entry 6% entry 46%}
.cat:nth-child(3n){animation-range:entry 12% entry 52%}
.svc{animation:prog linear both;animation-timeline:view();animation-range:contain 0% contain 100%}
}
.svc{--sh:min(100vh,860px);position:relative;height:calc(var(--sh)*3)}
.stage{position:sticky;top:0;height:var(--sh);min-height:640px;box-sizing:border-box;overflow:hidden;
--a:clamp(0,calc(var(--p)*3),1);--b:clamp(0,calc(var(--p)*3 - 1),1);--c:clamp(0,calc(var(--p)*3 - 2),1);
--v1:calc(1 - clamp(0,calc((var(--p) - .3)*20),1));
--v2:calc(clamp(0,calc((var(--p) - .3)*20),1) - clamp(0,calc((var(--p) - .64)*20),1));
--v3:clamp(0,calc((var(--p) - .64)*20),1);
--cnt:calc(1 + var(--a)*24)}
.sbody{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:clamp(16px,3cqw,40px)}
.rail{--rh:min(300px,36vh)}
.railfill{transform:scaleY(var(--p))}
.pencil{transform:translateY(calc(var(--p)*var(--rh)))}
.lit1{opacity:var(--v1)}.lit2{opacity:var(--v2)}.lit3{opacity:var(--v3)}
.stoplabel1{opacity:calc(.5 + var(--v1)*.5)}.stoplabel2{opacity:calc(.5 + var(--v2)*.5)}.stoplabel3{opacity:calc(.5 + var(--v3)*.5)}
.g1{opacity:var(--v1)}.g2{opacity:var(--v2)}.g3{opacity:var(--v3)}
.sh1{transform:translateX(calc(var(--a)*270px))}
.cp{opacity:clamp(0,calc((var(--a) - var(--d))*8),1);transform-box:fill-box;transform-origin:50% 100%;transform:rotate(calc(var(--a)*var(--r)))}
.sh2{transform:translateX(calc(var(--b)*430px))}
.rl{transform:rotate(calc(var(--b)*720deg))}
.rlr{transform:rotate(calc(var(--b)*-720deg))}
.face{opacity:clamp(0,calc((var(--b) - .55)*4),1)}
.hl{transform:translateX(calc(var(--b)*300px))}
.nb{transform-origin:380px 210px;transform:rotate(calc(var(--c)*-5deg)) scale(calc(1 + var(--c)*.04))}
.pg{transform:translateX(calc((1 - clamp(0,calc(var(--c)*5),1))*var(--o)))}
.hole{opacity:clamp(0,calc((var(--c) - var(--d))*20),1)}
.coil{opacity:clamp(0,calc((var(--c) - var(--d))*10),1);transform:translateX(calc((1 - clamp(0,calc((var(--c) - var(--d))*10),1))*-44px))}
.cover{opacity:clamp(0,calc((var(--c) - .88)*12),1)}
.cntpill{opacity:var(--v1)}
.cnt::after{counter-reset:cn var(--cnt);content:counter(cn)}
.descwrap .desc{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:16px}
.descwrap .d1{opacity:var(--v1)}.descwrap .d2{opacity:var(--v2)}.descwrap .d3{opacity:var(--v3)}
.cta{opacity:clamp(0,calc((var(--p) - .84)*10),1);transform:translateY(calc((1 - clamp(0,calc((var(--p) - .84)*10),1))*16px))}
@container site (max-width:768px){
.svc{height:calc(var(--sh)*2.2)}
.fancy{display:none}
.sbody{grid-template-columns:96px minmax(0,1fr) !important;gap:14px !important}
.rail{--rh:min(220px,30vh)}
.stoplabel1,.stoplabel2,.stoplabel3{font-size:12px !important}
}
@container site (max-width:900px){
.s3{grid-column:span 3}.s2{grid-column:span 3}
.navlinks{display:none !important}
.menu{display:block}
}
@container site (max-width:600px){
.s6,.s3,.s2{grid-column:span 6}
.sticky-bar{display:flex}
.hero-art{order:-1}
.hide-sm{display:none !important}
}
/* SHELVES: five-stop scroll story */
.shv{--sh:min(100vh,860px);position:relative;height:calc(var(--sh)*4)}
@supports (animation-timeline: view()){
.shv{animation:prog linear both;animation-timeline:view();animation-range:contain 0% contain 100%}
.sign{animation:signin linear backwards;animation-timeline:view();animation-range:entry 0% entry 70%}
}
@keyframes signin{from{opacity:0;transform:rotateX(90deg)}to{opacity:1;transform:none}}
.shv .stage{--t1:clamp(0,calc(var(--p)*5),1);--t2:clamp(0,calc(var(--p)*5 - 1),1);--t3:clamp(0,calc(var(--p)*5 - 2),1);--t4:clamp(0,calc(var(--p)*5 - 3),1);--t5:clamp(0,calc(var(--p)*5 - 4),1);
--s1:calc(1 - clamp(0,calc((var(--p) - .18)*25),1));
--s2:calc(clamp(0,calc((var(--p) - .18)*25),1) - clamp(0,calc((var(--p) - .38)*25),1));
--s3:calc(clamp(0,calc((var(--p) - .38)*25),1) - clamp(0,calc((var(--p) - .58)*25),1));
--s4:calc(clamp(0,calc((var(--p) - .58)*25),1) - clamp(0,calc((var(--p) - .78)*25),1));
--s5:clamp(0,calc((var(--p) - .78)*25),1);
--w:clamp(0,calc(var(--t1)*2.2),1)}
.shv .cta{opacity:clamp(0,calc((var(--p) - .92)*12),1);transform:translateY(calc((1 - clamp(0,calc((var(--p) - .92)*12),1))*16px))}
.pb{opacity:calc(1 - clamp(0,calc(var(--p)*1.6),1))}
.ps{opacity:clamp(0,calc(var(--p)*1.6),1)}
.dot1{opacity:var(--s1)}.dot2{opacity:var(--s2)}.dot3{opacity:var(--s3)}.dot4{opacity:var(--s4)}.dot5{opacity:var(--s5)}
.lab1{opacity:calc(.5 + var(--s1)*.5)}.lab2{opacity:calc(.5 + var(--s2)*.5)}.lab3{opacity:calc(.5 + var(--s3)*.5)}.lab4{opacity:calc(.5 + var(--s4)*.5)}.lab5{opacity:calc(.5 + var(--s5)*.5)}
.descwrap .sc1{opacity:var(--s1)}.descwrap .sc2{opacity:var(--s2)}.descwrap .sc3{opacity:var(--s3)}.descwrap .sc4{opacity:var(--s4)}.descwrap .sc5{opacity:var(--s5)}
.ground{opacity:calc(clamp(0,calc(var(--t3)*4),1)*(1 - clamp(0,calc(var(--t5)*6),1)))}
.sheet{transform-origin:380px 205px;opacity:calc(1 - clamp(0,calc(var(--t3)*3),1));transform:translateY(calc(var(--t3)*24px)) scale(calc(1 - var(--t3)*.3))}
.inkcover{transform:translateX(calc(var(--w)*210px))}
.hand{transform:translate(calc(300px + var(--w)*165px),218px);opacity:calc(1 - clamp(0,calc((var(--t1) - .5)*8),1))}
.tape{--tt:clamp(0,calc((var(--t1) - .5 - var(--d))*6),1);opacity:var(--tt);transform:translate(calc((1 - var(--tt))*var(--tx)),calc((1 - var(--tt))*var(--ty)))}
.dab{--pt:clamp(0,calc((var(--t2) - var(--d))*5),1);transform-box:fill-box;transform-origin:center;transform:scale(calc(var(--pt) + sin(calc(var(--pt)*180deg))*.25));opacity:clamp(0,calc(var(--pt)*5),1)}
.cut{opacity:calc(clamp(0,calc((var(--t2) - .5)*8),1)*(1 - clamp(0,calc(var(--t3)*4),1)));transform:translate(calc(clamp(0,calc((var(--t2) - .8)*5),1)*var(--cx)),calc(clamp(0,calc((var(--t2) - .8)*5),1)*70px + var(--t3)*120px))}
.scis{opacity:calc(clamp(0,calc((var(--t2) - .38)*10),1)*(1 - clamp(0,calc((var(--t2) - .95)*20),1)));transform:translateY(calc(clamp(0,calc((var(--t2) - .62)*6),1)*-104px))}
.sb1{transform-origin:510px 252px;transform:rotate(calc(sin(calc(var(--t2)*1800deg))*13deg))}
.sb2{transform-origin:510px 252px;transform:rotate(calc(sin(calc(var(--t2)*1800deg))*-13deg))}
.tp{--pt:clamp(0,calc((var(--t3) - var(--d))*5),1);transform-box:fill-box;transform-origin:50% 100%;transform:scale(calc(var(--pt) + sin(calc(var(--pt)*180deg))*.2));opacity:clamp(0,calc(var(--pt)*6),1)}
.fly{--ft:clamp(0,calc(var(--t4)*2.4),1);opacity:calc(1 - clamp(0,calc((var(--t4) - .3)*6),1));transform-origin:380px 280px;transform:translate(calc(var(--ft)*var(--dx)),calc(var(--ft)*var(--dy))) scale(calc(1 - var(--ft)*.55))}
.spin{transform-box:fill-box;transform-origin:center;transform:scaleX(cos(calc(var(--t3)*2880deg))) rotate(calc(sin(calc(var(--t3)*1440deg))*5deg))}
.bounce{transform:translateY(calc(sin(calc(var(--t3)*1260deg))*-9px*(1 - var(--t3))))}
.giftdrop{--g:clamp(0,calc(var(--t5)*6),1);--dd:clamp(0,calc((var(--t5) - .17)*6),1);transform-origin:380px 300px;transform:translate(calc(var(--g)*-50px),calc(var(--g)*-120px + var(--dd)*190px)) scale(calc(1 - var(--g)*.45));opacity:calc(1 - clamp(0,calc((var(--t5) - .3)*12),1))}
.gift{--gt:clamp(0,calc(var(--t4)*4),1);transform-box:fill-box;transform-origin:50% 100%;transform:scale(calc(var(--gt) + sin(calc(var(--gt)*180deg))*.15));opacity:var(--gt)}
.lid{transform:translateY(calc((1 - clamp(0,calc((var(--t4) - .4)*6),1))*-50px))}
.ribv{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(clamp(0,calc((var(--t4) - .55)*5),1))}
.ribh{transform-box:fill-box;transform-origin:50% 50%;transform:scaleX(clamp(0,calc((var(--t4) - .6)*5),1))}
.bow{--bp:clamp(0,calc((var(--t4) - .78)*6),1);transform-box:fill-box;transform-origin:center;transform:scale(calc(var(--bp) + sin(calc(var(--bp)*180deg))*.3));opacity:clamp(0,calc(var(--bp)*6),1)}
.tag{transform-origin:400px 226px;transform:rotate(calc(sin(calc(var(--t4)*1800deg))*14deg*(1 - var(--t4)*.6)));opacity:clamp(0,calc((var(--t4) - .86)*10),1)}
.bagx{--bt:clamp(0,calc(var(--t5)*10),1);opacity:var(--bt);transform:translateY(calc((1 - var(--bt))*40px))}
.bulge{transform-origin:330px 344px;transform:scale(calc(1 + var(--t5)*.03),calc(1 + var(--t5)*.02))}
.flap{transform-origin:330px 110px;transform:scaleY(calc(1 - 2*(1 - clamp(0,calc((var(--t5) - .34)*8),1))))}
.zpull{transform:translateX(calc(clamp(0,calc((var(--t5) - .48)*8),1)*136px))}
.mouth{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(clamp(0,calc((var(--t5) - .48)*8),1))}
.it{--it:clamp(0,calc((var(--t5) - var(--d))*12),1);opacity:clamp(0,calc(var(--it)*6),1);transform-box:fill-box;transform-origin:50% 100%;transform:translateY(calc((1 - var(--it))*-150px)) scale(calc(1 + sin(calc(var(--it)*180deg))*.06),calc(1 + sin(calc(var(--it)*180deg))*.1 - sin(calc(clamp(0,calc((var(--it) - .8)*5),1)*180deg))*.16))}
.tray{opacity:clamp(0,calc((var(--t5) - .5)*10),1)}
.ti{--it:clamp(0,calc((var(--t5) - var(--d))*10),1);opacity:clamp(0,calc(var(--it)*6),1);transform-box:fill-box;transform-origin:50% 100%;transform:translateY(calc((1 - var(--it))*-120px)) rotate(calc((1 - var(--it))*var(--rot)))}
@container site (max-width:900px){
.shv{height:calc(var(--sh)*3.2)}
.fancy{display:none}
}
@media (prefers-reduced-motion: reduce){
*{animation:none !important;transition:none !important;scroll-behavior:auto !important}
.draw{stroke-dashoffset:0}
.stamp{transform:rotate(-12deg)}
.svc{height:auto !important}
.stage{position:static !important;height:auto !important;min-height:0 !important}
.svc .machine,.rail{display:none !important}
.shv{--p:1;height:auto !important}
.sbody{grid-template-columns:minmax(0,1fr) !important}
.descwrap{display:flex;flex-direction:column;gap:24px;min-height:0 !important}
.descwrap .desc{position:static !important;opacity:1 !important}
.cta{opacity:1 !important;transform:none !important}
}
</style>
</helmet>

<div style="--brand: {{brand}}; --tint: {{heroTint}}; --ink: #34506B; --muted: #4F5F6E; --paper: #FBF7F0; --border: #E4DCCD; --yellow: #FFD84D; --pink: #FF8FB0; --blue: #DCEEFF; container-type: inline-size; container-name: site; width: 100%; box-sizing: border-box; position: relative; overflow-x: clip; font-family: 'DM Sans', system-ui, sans-serif; color: #34506B; background: #FBF7F0">
